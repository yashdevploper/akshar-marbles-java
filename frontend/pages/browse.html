<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse Marble Collection | Akshar Marbles</title>
  <link rel="stylesheet" href="../../assets/css/base/common.css">
  <link rel="stylesheet" href="../../assets/css/pages/browse.css">
</head>
<body class="store-browse-page">

  <!-- Centralized Storefront Navigation Bar Container -->
  <div id="site-navbar"></div>

  <!-- Breadcrumbs Bar -->
  <nav class="breadcrumbs-bar">
    <a href="../index.html">Home</a>
    <span>›</span>
    <span class="active-crumb">Browse Collection</span>
  </nav>

  <!-- Top Title & Filter Controls Bar -->
  <section class="browse-header-banner">
    <div class="browse-header-top-row">
      <div class="browse-title-group">
        <h1>Browse Marble Collection</h1>
        <p>Showing 12 varieties</p>
      </div>

      <div class="browse-header-actions">
        <div class="browse-search-box">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="browse-search-input" placeholder="Search marble, finish, origin..." aria-label="Search collection">
        </div>

        <button type="button" class="btn-filter-toggle">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>
          Filters
          <span class="filter-count-badge" style="display:none;">0</span>
        </button>

        <div class="sort-dropdown-wrapper" id="sort-dropdown-wrapper">
          <button type="button" class="btn-sort-dropdown" id="sort-dropdown-toggle">
            <span id="sort-dropdown-label">Sort: Recommended</span>
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="sort-dropdown-menu" id="sort-dropdown-menu">
            <button type="button" class="sort-dropdown-item active" data-sort="recommended">Recommended</button>
            <button type="button" class="sort-dropdown-item" data-sort="price-asc">Price: Low to High</button>
            <button type="button" class="sort-dropdown-item" data-sort="price-desc">Price: High to Low</button>
            <button type="button" class="sort-dropdown-item" data-sort="rating">Customer Rating</button>
            <button type="button" class="sort-dropdown-item" data-sort="name">Name: A to Z</button>
          </div>
        </div>

        <div class="view-toggle-group">
          <button type="button" class="view-toggle-btn active" title="Grid View">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          </button>
          <button type="button" class="view-toggle-btn" title="List View">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="3" y="4" width="4" height="4" rx="1"/><rect x="10" y="4" width="11" height="4" rx="1"/><rect x="3" y="10" width="4" height="4" rx="1"/><rect x="10" y="10" width="11" height="4" rx="1"/><rect x="3" y="16" width="4" height="4" rx="1"/><rect x="10" y="16" width="11" height="4" rx="1"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Active Filter Chips -->
    <div class="browse-active-filters-row" style="display:none;"></div>
  </section>

  <!-- Main 2-Column Content Layout -->
  <main class="browse-main-layout">
    
    <!-- Left Filters Sidebar -->
    <aside class="filters-sidebar">
      <div class="filters-sidebar-header">
        <h3>Filters</h3>
        <button type="button" class="filters-sidebar-close" aria-label="Close filters">✕</button>
      </div>
      
      <!-- Category Filter -->
      <div class="sidebar-filter-block">
        <div class="filter-block-title">CATEGORY</div>
        <div class="filter-checkbox-list">
          <label class="filter-checkbox-item" data-group="category" data-value="Italian Marble">
            <div class="filter-checkbox-left">
              <span class="custom-box"></span>
              <span>Italian Marble</span>
            </div>
            <span class="filter-item-count">4</span>
          </label>
          <label class="filter-checkbox-item" data-group="category" data-value="Spanish Marble">
            <div class="filter-checkbox-left">
              <span class="custom-box"></span>
              <span>Spanish Marble</span>
            </div>
            <span class="filter-item-count">3</span>
          </label>
          <label class="filter-checkbox-item" data-group="category" data-value="Indian Marble">
            <div class="filter-checkbox-left">
              <span class="custom-box"></span>
              <span>Indian Marble</span>
            </div>
            <span class="filter-item-count">3</span>
          </label>
          <label class="filter-checkbox-item" data-group="category" data-value="Onyx &amp; Exotic">
            <div class="filter-checkbox-left">
              <span class="custom-box"></span>
              <span>Onyx &amp; Exotic</span>
            </div>
            <span class="filter-item-count">1</span>
          </label>
          <label class="filter-checkbox-item" data-group="category" data-value="Granite">
            <div class="filter-checkbox-left">
              <span class="custom-box"></span>
              <span>Granite</span>
            </div>
            <span class="filter-item-count">1</span>
          </label>
        </div>
      </div>

      <!-- Price Per Sqft Filter -->
      <div class="sidebar-filter-block">
        <div class="filter-block-title">PRICE PER SQFT</div>
        <div class="price-slider-block">
          <input type="range" id="price-range-slider" min="100" max="2000" step="50" value="2000" class="price-range-input" aria-label="Price range per square foot">
          <div class="price-slider-values">
            <span>Min: ₹100</span>
            <b id="price-slider-display">Up to ₹2,000</b>
            <span>₹2,000</span>
          </div>
        </div>
      </div>

      <!-- Finish Filter -->
      <div class="sidebar-filter-block">
        <div class="filter-block-title">FINISH</div>
        <div class="filter-checkbox-list">
          <label class="filter-checkbox-item" data-group="finish" data-value="Polished">
            <div class="filter-checkbox-left">
              <span class="custom-box"></span>
              <span>Polished</span>
            </div>
          </label>
          <label class="filter-checkbox-item" data-group="finish" data-value="Honed">
            <div class="filter-checkbox-left">
              <span class="custom-box"></span>
              <span>Honed</span>
            </div>
          </label>
          <label class="filter-checkbox-item" data-group="finish" data-value="Brushed">
            <div class="filter-checkbox-left">
              <span class="custom-box"></span>
              <span>Brushed</span>
            </div>
          </label>
          <label class="filter-checkbox-item" data-group="finish" data-value="Leathered">
            <div class="filter-checkbox-left">
              <span class="custom-box"></span>
              <span>Leathered</span>
            </div>
          </label>
          <label class="filter-checkbox-item" data-group="finish" data-value="Backlit">
            <div class="filter-checkbox-left">
              <span class="custom-box"></span>
              <span>Backlit</span>
            </div>
          </label>
        </div>
      </div>

      <!-- Colour Tone Filter -->
      <div class="sidebar-filter-block">
        <div class="filter-block-title">COLOUR TONE</div>
        <div class="color-swatches-row">
          <div class="color-swatch-circle" style="background: #ffffff;" data-color-name="White" title="White"></div>
          <div class="color-swatch-circle" style="background: #222222;" data-color-name="Black" title="Black"></div>
          <div class="color-swatch-circle" style="background: #d9ccb5;" data-color-name="Tan / Cream" title="Tan / Cream"></div>
          <div class="color-swatch-circle" style="background: #8c6239;" data-color-name="Brown" title="Brown"></div>
          <div class="color-swatch-circle" style="background: #1e5b44;" data-color-name="Emerald Green" title="Emerald Green"></div>
          <div class="color-swatch-circle" style="background: #8a6e87;" data-color-name="Purple" title="Purple"></div>
          <div class="color-swatch-circle" style="background: #d1876e;" data-color-name="Terracotta" title="Terracotta"></div>
          <div class="color-swatch-circle" style="background: #5b7891;" data-color-name="Slate Blue" title="Slate Blue"></div>
        </div>
      </div>

      <!-- Origin Filter -->
      <div class="sidebar-filter-block">
        <div class="filter-block-title">ORIGIN</div>
        <div class="filter-checkbox-list">
          <label class="filter-checkbox-item" data-group="origin" data-value="Italy">
            <div class="filter-checkbox-left">
              <span class="custom-box"></span>
              <span>Italy</span>
            </div>
          </label>
          <label class="filter-checkbox-item" data-group="origin" data-value="Spain">
            <div class="filter-checkbox-left">
              <span class="custom-box"></span>
              <span>Spain</span>
            </div>
          </label>
          <label class="filter-checkbox-item" data-group="origin" data-value="India">
            <div class="filter-checkbox-left">
              <span class="custom-box"></span>
              <span>India</span>
            </div>
          </label>
          <label class="filter-checkbox-item" data-group="origin" data-value="Turkey">
            <div class="filter-checkbox-left">
              <span class="custom-box"></span>
              <span>Turkey</span>
            </div>
          </label>
          <label class="filter-checkbox-item" data-group="origin" data-value="Pakistan">
            <div class="filter-checkbox-left">
              <span class="custom-box"></span>
              <span>Pakistan</span>
            </div>
          </label>
        </div>
      </div>

      <!-- Availability Filter -->
      <div class="sidebar-filter-block">
        <div class="filter-block-title">AVAILABILITY</div>
        <div class="filter-checkbox-list">
          <label class="filter-checkbox-item" data-group="availability" data-value="In Stock">
            <div class="filter-checkbox-left">
              <span class="custom-box"></span>
              <span>In Stock</span>
            </div>
          </label>
          <label class="filter-checkbox-item" data-group="availability" data-value="Available to Order">
            <div class="filter-checkbox-left">
              <span class="custom-box"></span>
              <span>Available to Order</span>
            </div>
          </label>
        </div>
      </div>

    </aside>

    <!-- Right Products Grid -->
    <div>
      <div class="browse-products-grid"></div>

      <!-- Centered Pagination Controls -->
      <div class="browse-pagination-wrapper">
        <a href="#" class="page-btn" aria-label="Previous page">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <a href="#" class="page-btn active">1</a>
        <a href="#" class="page-btn">2</a>
        <a href="#" class="page-btn">3</a>
        <span class="page-btn dots">…</span>
        <a href="#" class="page-btn">42</a>
        <a href="#" class="page-btn" aria-label="Next page">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </a>
      </div>

    </div>

  </main>

  <script src="../components/auth.js"></script>
  <script src="../components/navbar.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="../../assets/js/config/api-config.js"></script>
  <script src="../../assets/js/pages/browse.js"></script>
  <script src="../../assets/js/pages/cart.js"></script>
</body>
</html>
