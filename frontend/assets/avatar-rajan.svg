<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-rajan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#345446"/>
      <stop offset="100%" stop-color="#1f362c"/>
    </linearGradient>
    <linearGradient id="skin-rajan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8d1b3"/>
      <stop offset="100%" stop-color="#e2b291"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg-rajan)"/>
  <!-- Hair back -->
  <circle cx="50" cy="42" r="22" fill="#1b1d20"/>
  <!-- Shoulders & Suit -->
  <path d="M12,100 C12,74 34,70 42,68 L42,58 L58,58 L58,68 C66,70 88,74 88,100 Z" fill="#2c3a44"/>
  <!-- Shirt collar -->
  <polygon points="44,68 50,78 56,68 54,60 46,60" fill="#ffffff"/>
  <!-- Neck -->
  <path d="M43,50 L57,50 L56,62 L44,62 Z" fill="url(#skin-rajan)"/>
  <!-- Face -->
  <ellipse cx="50" cy="45" rx="16" ry="19" fill="url(#skin-rajan)"/>
  <!-- Hair front -->
  <path d="M34,40 C34,26 44,22 50,22 C56,22 66,26 66,40 C63,33 58,32 50,33 C42,32 37,33 34,40 Z" fill="#1b1d20"/>
  <!-- Glasses -->
  <rect x="38" y="40" width="10" height="8" rx="2" fill="none" stroke="#222" stroke-width="1.5"/>
  <rect x="52" y="40" width="10" height="8" rx="2" fill="none" stroke="#222" stroke-width="1.5"/>
  <line x1="48" y1="44" x2="52" y2="44" stroke="#222" stroke-width="1.5"/>
  <!-- Eyes -->
  <circle cx="43" cy="44" r="1.5" fill="#222"/>
  <circle cx="57" cy="44" r="1.5" fill="#222"/>
  <!-- Nose & Smile -->
  <path d="M50,44 L49,50 L52,50" stroke="#c48e6c" stroke-width="1.2" fill="none"/>
  <path d="M46,55 Q50,58 54,55" stroke="#9e5b4c" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>
